<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Curriculum Mapper</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-brand">
      <h1>AI Curriculum Mapper</h1>
      <span class="header-sub">Imperial College Computing ↔ ACM/IEEE CS2023</span>
    </div>
    <nav class="tab-nav" id="tab-nav">
      <a class="tab-btn" data-route="overview"  href="#/overview">Overview</a>
      <a class="tab-btn" data-route="map"       href="#/map">Curriculum Map</a>
      <a class="tab-btn" data-route="explore"   href="#/explore">Explore</a>
      <a class="tab-btn" data-route="coverage"  href="#/coverage">Coverage</a>
      <a class="tab-btn" data-route="review"    href="#/review">Review</a>
    </nav>
    <div class="header-health" id="health-badge">
      <span class="dot"></span>
      <span id="health-text">connecting…</span>
    </div>
  </header>

  <div class="app-notice" role="note">
    <span class="app-notice-icon">⚠</span>
    <span>Every mapping here is an <strong>AI-generated suggestion</strong> from automated NLP — a starting point for review, not ground truth.</span>
  </div>

  <main id="app"><!-- pages render here --></main>

  <!-- Reassign modal (used by the Review page) -->
  <div class="modal-overlay hidden" id="reassign-modal">
    <div class="modal">
      <h3>Reassign mapping</h3>
      <div class="form-group">
        <label>New Knowledge Area</label>
        <select id="reassign-ka-select"></select>
      </div>
      <div class="form-group">
        <label>Comment (optional)</label>
        <textarea id="reassign-comment" rows="3" placeholder="Reason for reassignment…"></textarea>
      </div>
      <div class="modal-actions">
        <button id="reassign-confirm" class="btn btn-primary">Reassign</button>
        <button id="reassign-cancel" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div id="graph-tooltip" class="graph-tooltip hidden"></div>
  <div id="edge-evidence" class="edge-evidence hidden"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
