<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Curriculum Mapper</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-brand">
      <h1>AI Curriculum Mapper</h1>
      <span class="header-sub">Imperial College Computing ↔ ACM/IEEE CS2023</span>
    </div>
    <nav class="tab-nav" id="tab-nav">
      <button class="tab-btn active" data-tab="graph">Graph</button>
      <button class="tab-btn" data-tab="alignments">Alignments</button>
      <button class="tab-btn" data-tab="gaps">Gap Report</button>
    </nav>
    <div class="header-health" id="health-badge">
      <span class="dot"></span>
      <span id="health-text">connecting…</span>
    </div>
  </header>

  <main class="app-body">
    <!-- LEFT SIDEBAR: module search + list -->
    <aside class="sidebar" id="sidebar">
      <div class="search-bar">
        <input type="text" id="module-search" placeholder="Search modules…" autocomplete="off" />
        <select id="level-filter">
          <option value="">All levels</option>
          <option value="1">Level 1</option>
          <option value="2">Level 2</option>
          <option value="3">Level 3</option>
          <option value="4">Level 4</option>
        </select>
      </div>
      <div class="module-list" id="module-list">
        <p class="placeholder">Loading modules…</p>
      </div>
    </aside>

    <!-- CENTRE: tab panes -->
    <section class="centre-pane">
      <div class="tab-pane active" id="tab-graph">
        <div class="graph-controls">
          <select id="graph-view-select" class="graph-ctrl-btn" title="Switch graph view" style="padding:4px 8px;cursor:pointer;">
            <option value="module-module">Module similarity</option>
            <option value="bipartite">Module ↔ Concepts</option>
          </select>
          <button id="graph-fit-btn" class="graph-ctrl-btn" title="Fit graph to screen">⊡ Fit</button>
          <button id="graph-layout-btn" class="graph-ctrl-btn" title="Re-run layout">↻ Layout</button>
          <label class="graph-ctrl-label" id="edge-threshold-label">
            Min edge strength
            <input type="range" id="edge-threshold" min="0" max="0.9" step="0.05" value="0" />
            <span id="edge-threshold-val">0.00</span>
          </label>
          <span class="graph-ctrl-hint" id="graph-hint">Raise slider to hide weak connections and reveal clusters</span>
        </div>
        <div class="graph-viewport">
          <div id="cy" class="cytoscape-container"></div>
          <div class="graph-legend" id="graph-legend"></div>
          <div class="edge-legend" id="edge-legend">
            <div class="legend-item"><div class="edge-sample edge-solid"></div><span>Concept similarity</span></div>
            <div class="legend-item"><div class="edge-sample edge-dashed"></div><span>Prerequisite</span></div>
          </div>
        </div>
      </div>

      <div class="tab-pane" id="tab-alignments">
        <div class="alignment-controls">
          <select id="ka-filter">
            <option value="">All KAs</option>
          </select>
          <select id="ambiguous-filter">
            <option value="">All</option>
            <option value="true">Ambiguous only</option>
            <option value="false">Unambiguous</option>
          </select>
          <select id="validated-filter">
            <option value="">Any validation</option>
            <option value="true">Accepted</option>
            <option value="false">Rejected</option>
            <option value="null">Unvalidated</option>
          </select>
        </div>
        <div id="alignment-table-container"></div>
      </div>

      <div class="tab-pane" id="tab-gaps">
        <div id="gap-report-container"></div>
      </div>
    </section>

    <!-- RIGHT SIDEBAR: module detail panel -->
    <aside class="detail-panel" id="detail-panel">
      <div id="module-detail-content">
        <p class="placeholder">Select a module to see details.</p>
      </div>
    </aside>
  </main>

  <!-- Reassign modal -->
  <div class="modal-overlay hidden" id="reassign-modal">
    <div class="modal">
      <h3>Reassign Alignment</h3>
      <div class="form-group">
        <label>New Knowledge Area</label>
        <select id="reassign-ka-select"></select>
      </div>
      <div class="form-group">
        <label>Comment (optional)</label>
        <textarea id="reassign-comment" rows="3" placeholder="Reason for reassignment…"></textarea>
      </div>
      <div class="modal-actions">
        <button id="reassign-confirm" class="btn btn-primary">Reassign</button>
        <button id="reassign-cancel" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div id="graph-tooltip" class="graph-tooltip hidden"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
