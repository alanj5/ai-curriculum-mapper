name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache spaCy + NLTK data
        uses: actions/cache@v4
        with:
          path: |
            ~/nltk_data
            ~/.cache/spacy
          key: ${{ runner.os }}-nlp-data-v1

      - name: Cache HuggingFace / SBERT models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ${{ runner.os }}-sbert-${{ hashFiles('curriculum_mapper/config.py') }}

      - name: Cache pipeline embeddings
        uses: actions/cache@v4
        with:
          path: data/cache
          key: ${{ runner.os }}-embeddings-${{ hashFiles('data/raw/**', 'curriculum_mapper/nlp/**', 'curriculum_mapper/config.py') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Download spaCy and NLTK models
        run: |
          python -m spacy download en_core_web_sm
          python -c "import nltk; nltk.download(['stopwords','wordnet','punkt','averaged_perceptron_tagger','punkt_tab'])"

      - name: Lint with ruff
        run: ruff check curriculum_mapper/ scripts/ tests/

      - name: Run unit tests with coverage
        run: pytest tests/unit/ --cov=curriculum_mapper --cov-report=term-missing -q

      - name: Build pipeline (DB + graph artefacts) for integration tests
        run: |
          python scripts/ingest_modules.py
          python scripts/run_nlp_pipeline.py
          python scripts/run_alignment.py
          python scripts/build_graph.py

      - name: Run integration tests
        run: pytest tests/integration/ -q
